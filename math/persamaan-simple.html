<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misi Rahasia Kotak Demon Slayer! ⚔️🎁</title>
  <style>
    :root {
      --primary: #E63946;
      --secondary: #1D3557;
      --accent: #F4A261;
      --green: #2A9D8F;
      --demon-green: #2EC4B6;
      --tanjiro-check: #0A5C36;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
      background: linear-gradient(135deg, #111827 0%, #1F2937 50%, #0F172A 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #F8FAFC;
    }

    /* Tombol Navigasi Beranda */
    .top-nav {
      width: 100%;
      max-width: 820px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    header {
      text-align: center;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      color: #FFD166;
      text-shadow: 0 3px 8px rgba(0,0,0,0.5);
    }

    /* Pilihan Level */
    .level-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .level-btn {
      padding: 8px 14px;
      background: #374151;
      color: #D1D5DB;
      border: 2px solid #4B5563;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .level-btn.active {
      background: #E63946;
      color: white;
      border-color: #F87171;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(230, 57, 70, 0.5);
    }

    /* Papan Game */
    .game-board {
      background: #1F2937;
      border-radius: 24px;
      padding: 22px;
      width: 100%;
      max-width: 820px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid #374151;
      position: relative;
    }

    /* Action bar: Reset & Acak */
    .control-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      width: 100%;
      justify-content: flex-end;
    }

    .action-btn {
      background: #4B5563;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.15s;
    }

    .action-btn:active { transform: scale(0.95); }
    .action-btn.random-btn { background: #0284C7; }
    .action-btn.reset-btn { background: #64748B; }

    /* Area Persamaan */
    .equation-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      margin: 14px 0 20px 0;
    }

    .side-zone {
      flex: 1;
      min-height: 140px;
      background: #111827;
      border: 3px dashed #4B5563;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      flex-wrap: wrap;
      transition: background 0.2s, border-color 0.2s;
    }

    .side-zone.drag-over {
      background: #1E3A5F;
      border-color: #38BDF8;
    }

    .equals-bridge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F59E0B;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      font-size: 32px;
      font-weight: bold;
      color: #111827;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
      position: relative;
    }

    .equals-bridge::after {
      content: '🔄 Berubah Tanda!';
      position: absolute;
      bottom: -22px;
      font-size: 10px;
      white-space: nowrap;
      color: #FBBF24;
      font-weight: bold;
    }

    /* Kartu */
    .card {
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 26px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      touch-action: none;
    }

    .card.box {
      background: linear-gradient(135deg, #EF4444, #F97316);
      color: white;
      min-width: 90px;
      border: 2px solid #FEF08A;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    }

    .card.draggable-op {
      background: linear-gradient(135deg, #0284C7, #38BDF8);
      color: #0F172A;
      cursor: grab;
      border: 2px solid #BAE6FD;
    }

    .card.draggable-op:active {
      cursor: grabbing;
      transform: scale(1.08);
    }

    .card.number-static {
      background: #374151;
      color: #F3F4F6;
      min-width: 50px;
      border: 1px solid #6B7280;
    }

    /* Area Form Jawaban & Challenge */
    .solution-box {
      width: 100%;
      background: #111827;
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      border: 1px solid #374151;
    }

    .calc-preview {
      font-size: 17px;
      color: #E2E8F0;
      text-align: center;
    }

    .guess-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="number"] {
      width: 100px;
      height: 48px;
      font-size: 24px;
      text-align: center;
      border-radius: 12px;
      border: 3px solid #4B5563;
      background: #1F2937;
      color: white;
      font-weight: bold;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: #38BDF8;
    }

    button.check-btn {
      padding: 12px 22px;
      font-size: 18px;
      font-weight: bold;
      background: #10B981;
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
      transition: 0.15s;
    }

    button.check-btn:active { transform: translateY(2px); }

    .feedback {
      font-size: 16px;
      font-weight: bold;
      min-height: 24px;
      text-align: center;
    }

    .feedback.success { color: #34D399; }
    .feedback.error { color: #F87171; }
    .feedback.warning { color: #FBBF24; }

    /* MODAL KARAKTER DEMON SLAYER (Reward Animasi Bergerak) */
    .reward-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      flex-direction: column;
      animation: fadeIn 0.3s ease;
    }

    .reward-box {
      background: linear-gradient(135deg, #1E1B4B 0%, #312E81 100%);
      border: 4px solid #F59E0B;
      border-radius: 28px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.6);
      max-width: 90%;
      width: 380px;
      position: relative;
    }

    /* Animasi Karakter SVG Pedang Bergerak */
    .character-avatar {
      width: 140px;
      height: 140px;
      margin: 0 auto 12px auto;
      position: relative;
      animation: charJump 1s infinite alternate ease-in-out;
    }

    .sword-slash {
      transform-origin: 20px 80px;
      animation: slashMotion 0.8s infinite ease-in-out alternate;
    }

    .fire-aura {
      animation: pulseFire 0.7s infinite alternate;
      transform-origin: center;
    }

    @keyframes charJump {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-16px) rotate(2deg); }
    }

    @keyframes slashMotion {
      0% { transform: rotate(-15deg); }
      100% { transform: rotate(45deg); }
    }

    @keyframes pulseFire {
      0% { transform: scale(0.95); opacity: 0.7; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="../index.html" class="nav-btn">🏠 Ke Menu Utama</a>
    <span style="font-weight: bold; color: #FBBF24;">Pernapasan Matematika: Jurus 1! ⚡</span>
  </div>

  <header>
    <h1>⚔️ Misi Kotak Rahasia Korps Pembasmi Iblis</h1>
  </header>

  <div class="level-tabs">
    <button class="level-btn active" onclick="selectLevel(0)">Level 1: Tambah & Kurang</button>
    <button class="level-btn" onclick="selectLevel(1)">Level 2: Perkalian</button>
    <button class="level-btn" onclick="selectLevel(2)">Level 3: Pembagian</button>
    <button class="level-btn" onclick="selectLevel(3)">Level 4: Jurus Campuran</button>
  </div>

  <div class="game-board">
    <div class="control-actions">
      <button class="action-btn random-btn" onclick="generateRandomProblem()">🎲 Ganti Soal Baru</button>
      <button class="action-btn reset-btn" onclick="resetCurrentProblem()">🔄 Ulangi Posisi</button>
    </div>

    <div class="equation-container">
      <div class="side-zone" id="left-zone" data-side="left"></div>
      <div class="equals-bridge">=</div>
      <div class="side-zone" id="right-zone" data-side="right"></div>
    </div>

    <div class="solution-box">
      <div class="calc-preview" id="calc-preview">Geser operasi matematika ke sisi kanan tanda sama dengan!</div>
      
      <div class="guess-row">
        <span>🎁 = </span>
        <input type="number" id="answer-input" placeholder="?">
        <button class="check-btn" onclick="handleOpenBox()">Buka Kotak! ⚔️</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <!-- POPUP REWARD ANIMASI DEMON SLAYER -->
  <div class="reward-overlay" id="reward-modal">
    <div class="reward-box">
      <!-- Karakter Animasi SVG: Tanjiro Chibi dengan Pedang Nichirin & Api Hinokami -->
      <div class="character-avatar">
        <svg viewBox="0 0 120 120" width="100%" height="100%">
          <!-- Api Hinokami Kagura -->
          <circle class="fire-aura" cx="60" cy="60" r="54" fill="none" stroke="#F59E0B" stroke-width="6" stroke-dasharray="10 8" />
          <circle class="fire-aura" cx="60" cy="60" r="48" fill="none" stroke="#EF4444" stroke-width="4" />
          
          <!-- Rambut & Wajah -->
          <circle cx="60" cy="50" r="26" fill="#FCD34D" /> <!-- Wajah -->
          <path d="M 36 45 Q 60 20 84 45 Q 60 30 36 45" fill="#7F1D1D" /> <!-- Rambut depan -->
          <!-- Anting Hanafuda -->
          <rect x="33" y="52" width="5" height="12" fill="#FFFFFF" stroke="#111" stroke-width="1"/>
          <circle cx="35.5" cy="55" r="1.5" fill="#EF4444" />
          <!-- Mata -->
          <circle cx="52" cy="50" r="4" fill="#7F1D1D" />
          <circle cx="68" cy="50" r="4" fill="#7F1D1D" />
          <circle cx="53" cy="49" r="1.5" fill="#FFF" />
          <circle cx="69" cy="49" r="1.5" fill="#FFF" />
          <!-- Senyum Lebar -->
          <path d="M 54 60 Q 60 66 66 60" stroke="#7F1D1D" stroke-width="2.5" fill="none" stroke-linecap="round" />
          <!-- Tanda Lahir Tanjiro -->
          <path d="M 68 36 Q 73 38 72 44" stroke="#B91C1C" stroke-width="3" fill="none" />
          
          <!-- Badan / Haori Kotak-kotak Hijau Hitam -->
          <path d="M 40 76 L 80 76 L 86 106 L 34 106 Z" fill="#0A5C36" />
          <rect x="48" y="76" width="12" height="30" fill="#111827" />
          <rect x="68" y="76" width="8" height="30" fill="#111827" />

          <!-- Tangan & Pedang Nichirin Bergerak -->
          <g class="sword-slash">
            <rect x="75" y="70" width="45" height="4" fill="#1F2937" rx="2" stroke="#DC2626" stroke-width="1.5" />
            <circle cx="75" cy="72" r="5" fill="#F59E0B" />
          </g>
        </svg>
      </div>

      <h2 style="margin: 6px 0; color: #FBBF24;">LUAR BIASA! 💥</h2>
      <p style="color: #E2E8F0; font-size: 15px; margin-bottom: 18px;" id="reward-desc">
        Kamu berhasil memecahkan teka-teki kotak dan mengeluarkan jurus pernapasan!
      </p>

      <button class="check-btn" style="width: 100%; background: #EF4444;" onclick="closeRewardModal()">
        Lanjut Misi Berikutnya! ⚔️
      </button>
    </div>
  </div>

  <script>
    let currentLevelIdx = 0;
    let initialProblemData = null; // Menyimpan format awal untuk fitur reset
    let currentData = null;

    const inverseOps = {
      '+': '-',
      '-': '+',
      '×': '÷',
      '÷': '×'
    };

    // Generator Soal Acak
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function createRandomLevelData(levelIdx) {
      if (levelIdx === 0) {
        // Tambah & Kurang
        const isPlus = Math.random() > 0.5;
        const op = isPlus ? '+' : '-';
        const num = getRandomInt(2, 9);
        const x = getRandomInt(3, 10);
        const target = isPlus ? (x + num) : (x + 10 - num);
        const actualX = isPlus ? (target - num) : (target + num);

        return {
          left: [
            { id: 'box', type: 'box', label: '🎁' },
            { id: 'op1', type: 'op', op: op, val: num, currentSide: 'left' }
          ],
          right: [{ id: 'res', type: 'number', val: target }],
          targetAnswer: actualX
        };
      } else if (levelIdx === 1) {
        // Perkalian (x * a = b)
        const a = getRandomInt(2, 5);
        const actualX = getRandomInt(2, 9);
        const target = actualX * a;

        return {
          left: [
            { id: 'box', type: 'box', label: '🎁' },
            { id: 'op1', type: 'op', op: '×', val: a, currentSide: 'left' }
          ],
          right: [{ id: 'res', type: 'number', val: target }],
          targetAnswer: actualX
        };
      } else if (levelIdx === 2) {
        // Pembagian (x / a = b)
        const a = getRandomInt(2, 5);
        const b = getRandomInt(2, 8);
        const actualX = a * b;

        return {
          left: [
            { id: 'box', type: 'box', label: '🎁' },
            { id: 'op1', type: 'op', op: '÷', val: a, currentSide: 'left' }
          ],
          right: [{ id: 'res', type: 'number', val: b }],
          targetAnswer: actualX
        };
      } else {
        // Campuran: (x * a) + b = target
        const a = getRandomInt(2, 4);
        const actualX = getRandomInt(2, 6);
        const b = getRandomInt(1, 8);
        const target = (actualX * a) + b;

        return {
          left: [
            { id: 'box', type: 'box', label: '🎁' },
            { id: 'op1', type: 'op', op: '×', val: a, currentSide: 'left' },
            { id: 'op2', type: 'op', op: '+', val: b, currentSide: 'left' }
          ],
          right: [{ id: 'res', type: 'number', val: target }],
          targetAnswer: actualX
        };
      }
    }

    function selectLevel(idx) {
      currentLevelIdx = idx;
      document.querySelectorAll('.level-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });
      generateRandomProblem();
    }

    function generateRandomProblem() {
      initialProblemData = createRandomLevelData(currentLevelIdx);
      resetCurrentProblem();
    }

    function resetCurrentProblem() {
      // Mengkloning data dari problem asli
      currentData = JSON.parse(JSON.stringify(initialProblemData));
      document.getElementById('feedback').innerText = '';
      document.getElementById('answer-input').value = '';
      renderBoard();
    }

    function renderBoard() {
      const leftZone = document.getElementById('left-zone');
      const rightZone = document.getElementById('right-zone');

      leftZone.innerHTML = '';
      rightZone.innerHTML = '';

      currentData.left.forEach(item => leftZone.appendChild(createCard(item)));
      currentData.right.forEach(item => rightZone.appendChild(createCard(item)));

      setupDropZones();
      updateStatusGuide();
    }

    function createCard(item) {
      const card = document.createElement('div');
      card.id = item.id;
      card.classList.add('card');

      if (item.type === 'box') {
        card.classList.add('box');
        card.innerText = item.label;
      } else if (item.type === 'op') {
        card.classList.add('draggable-op');
        card.innerText = `${item.op} ${item.val}`;
        card.draggable = true;
        setupDragAndTouch(card, item);
      } else if (item.type === 'number') {
        card.classList.add('number-static');
        card.innerText = item.val;
      }

      return card;
    }

    // Drag & Drop Handling (Mouse & iPad Touch)
    let activeDragItem = null;

    function setupDragAndTouch(card, itemData) {
      card.addEventListener('dragstart', (e) => {
        activeDragItem = itemData;
        e.dataTransfer.setData('text/plain', itemData.id);
      });

      card.addEventListener('touchstart', (e) => {
        activeDragItem = itemData;
      }, { passive: true });

      card.addEventListener('touchend', (e) => {
        const touch = e.changedTouches[0];
        const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
        const zone = targetElement ? targetElement.closest('.side-zone') : null;

        if (zone && zone.dataset.side !== activeDragItem.currentSide) {
          executeMove(activeDragItem, zone.dataset.side);
        }
        activeDragItem = null;
      });
    }

    function setupDropZones() {
      document.querySelectorAll('.side-zone').forEach(zone => {
        zone.ondragover = (e) => { e.preventDefault(); zone.classList.add('drag-over'); };
        zone.ondragleave = () => { zone.classList.remove('drag-over'); };
        zone.ondrop = (e) => {
          e.preventDefault();
          zone.classList.remove('drag-over');
          if (activeDragItem && activeDragItem.currentSide !== zone.dataset.side) {
            executeMove(activeDragItem, zone.dataset.side);
          }
        };
      });
    }

    function executeMove(item, newSide) {
      const oldSide = item.currentSide;
      currentData[oldSide] = currentData[oldSide].filter(i => i.id !== item.id);
      
      // Pembalikan tanda otomatis
      item.op = inverseOps[item.op];
      item.currentSide = newSide;
      currentData[newSide].push(item);

      renderBoard();
    }

    function updateStatusGuide() {
      const remainingLeftOps = currentData.left.filter(i => i.type === 'op');
      const preview = document.getElementById('calc-preview');

      if (remainingLeftOps.length === 0) {
        let formula = '';
        currentData.right.forEach(it => {
          if (it.type === 'number') formula += `${it.val} `;
          if (it.type === 'op') formula += `${it.op} ${it.val} `;
        });
        preview.innerHTML = `Kotak sudah sendirian! Selesaikan: <b style="color:#38BDF8; font-size:20px;">${formula}</b>`;
      } else {
        preview.innerText = `Geser ${remainingLeftOps.length} kartu lagi ke kanan agar kotak 🎁 sendirian!`;
      }
    }

    // Tantangan Validasi & Reward Karakter
    function handleOpenBox() {
      const remainingLeftOps = currentData.left.filter(i => i.type === 'op');
      const inputVal = parseInt(document.getElementById('answer-input').value);
      const feedback = document.getElementById('feedback');

      // TANTANGAN 1: Wajib geser kartu dulu
      if (remainingLeftOps.length > 0) {
        feedback.className = 'feedback warning';
        feedback.innerText = `⚠️ Tidak bisa ditebak langsung! Geser kartu operasinya dulu ke kanan tanda sama dengan!`;
        return;
      }

      // TANTANGAN 2: Input tidak boleh kosong
      if (isNaN(inputVal)) {
        feedback.className = 'feedback warning';
        feedback.innerText = `Ketik dulu angka tebakanmu di dalam kolom!`;
        return;
      }

      // TANTANGAN 3: Pencocokan Jawaban
      if (inputVal === currentData.targetAnswer) {
        feedback.className = 'feedback success';
        feedback.innerText = `BENAR! Kotak Terbuka! 🌟`;

        // Tampilkan Modal Demon Slayer
        document.getElementById('reward-desc').innerHTML = 
          `Hebat sekali! Isi kotak 🎁 adalah <b>${inputVal}</b>.<br>Tanjiro bangga dengan kemampuan analisismu!`;
        document.getElementById('reward-modal').style.display = 'flex';
      } else {
        feedback.className = 'feedback error';
        feedback.innerText = `Kurang tepat, ayo coba hitung ulang kembali sisi kanannya! Semangat! 💪`;
      }
    }

    function closeRewardModal() {
      document.getElementById('reward-modal').style.display = 'none';
      generateRandomProblem(); // Berikan soal baru setelah berhasil
    }

    // Mulai Level 1 Pertama Kali
    selectLevel(0);
  </script>
</body>
</html>
