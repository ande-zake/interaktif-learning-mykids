<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misi Rahasia Kotak Demon Slayer! ⚔️🎁</title>
  <style>
    :root {
      --primary: #E63946;
      --secondary: #1D3557;
      --accent: #F4A261;
      --green: #2A9D8F;
      --demon-green: #2EC4B6;
      --tanjiro-check: #0A5C36;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
      background: linear-gradient(135deg, #111827 0%, #1F2937 50%, #0F172A 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #F8FAFC;
    }

    /* Tombol Navigasi Beranda */
    .top-nav {
      width: 100%;
      max-width: 820px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.15);
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    header {
      text-align: center;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      color: #FFD166;
      text-shadow: 0 3px 8px rgba(0,0,0,0.5);
    }

    /* Pilihan Level */
    .level-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .level-btn {
      padding: 8px 14px;
      background: #374151;
      color: #D1D5DB;
      border: 2px solid #4B5563;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .level-btn.active {
      background: #E63946;
      color: white;
      border-color: #F87171;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(230, 57, 70, 0.5);
    }

    /* Papan Game */
    .game-board {
      background: #1F2937;
      border-radius: 24px;
      padding: 22px;
      width: 100%;
      max-width: 820px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 2px solid #374151;
      position: relative;
    }

    /* Action bar: Reset & Acak */
    .control-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
      width: 100%;
      justify-content: flex-end;
    }

    .action-btn {
      background: #4B5563;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.15s;
    }

    .action-btn:active { transform: scale(0.95); }
    .action-btn.random-btn { background: #0284C7; }
    .action-btn.reset-btn { background: #64748B; }

    /* Area Persamaan */
    .equation-container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      width: 100%;
      margin: 14px 0 20px 0;
    }

    .side-zone {
      flex: 1;
      min-height: 140px;
      background: #111827;
      border: 3px dashed #4B5563;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      flex-wrap: wrap;
      transition: background 0.2s, border-color 0.2s;
    }

    .side-zone.drag-over {
      background: #1E3A5F;
      border-color: #38BDF8;
    }

    .equals-bridge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #F59E0B;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      font-size: 32px;
      font-weight: bold;
      color: #111827;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
      position: relative;
    }

    .equals-bridge::after {
      content: '🔄 Berubah Tanda!';
      position: absolute;
      bottom: -22px;
      font-size: 10px;
      white-space: nowrap;
      color: #FBBF24;
      font-weight: bold;
    }

    /* Kartu */
    .card {
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 26px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      touch-action: none;
    }

    .card.box {
      background: linear-gradient(135deg, #EF4444, #F97316);
      color: white;
      min-width: 90px;
      border: 2px solid #FEF08A;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    }

    .card.draggable-op {
      background: linear-gradient(135deg, #0284C7, #38BDF8);
      color: #0F172A;
      cursor: grab;
      border: 2px solid #BAE6FD;
    }

    .card.draggable-op:active {
      cursor: grabbing;
      transform: scale(1.08);
    }

    .card.number-static {
      background: #374151;
      color: #F3F4F6;
      min-width: 50px;
      border: 1px solid #6B7280;
    }

    .card.can-drag-left {
      cursor: grab;
      border: 2px dashed #FBBF24;
    }

    /* Kurung grup: hitung yang di dalam dulu */
    .paren-group {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 8px;
      background: rgba(251, 191, 36, 0.12);
      border: 2px solid #FBBF24;
      border-radius: 18px;
      flex-wrap: wrap;
    }

    .paren-mark {
      font-size: 38px;
      font-weight: bold;
      color: #FBBF24;
      line-height: 1;
      padding: 0 2px;
    }

    .mix-hint {
      display: none;
      width: 100%;
      background: #422006;
      border: 2px solid #F59E0B;
      color: #FDE68A;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 14px;
      text-align: center;
      margin-bottom: 4px;
      line-height: 1.45;
    }

    /* Area Form Jawaban & Challenge */
    .solution-box {
      width: 100%;
      background: #111827;
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      border: 1px solid #374151;
    }

    .calc-preview {
      font-size: 17px;
      color: #E2E8F0;
      text-align: center;
    }

    .guess-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="number"] {
      width: 100px;
      height: 48px;
      font-size: 24px;
      text-align: center;
      border-radius: 12px;
      border: 3px solid #4B5563;
      background: #1F2937;
      color: white;
      font-weight: bold;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: #38BDF8;
    }

    button.check-btn {
      padding: 12px 22px;
      font-size: 18px;
      font-weight: bold;
      background: #10B981;
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
      transition: 0.15s;
    }

    button.check-btn:active { transform: translateY(2px); }

    .feedback {
      font-size: 16px;
      font-weight: bold;
      min-height: 24px;
      text-align: center;
    }

    .feedback.success { color: #34D399; }
    .feedback.error { color: #F87171; }
    .feedback.warning { color: #FBBF24; }

    /* MODAL KARAKTER DEMON SLAYER (Reward Animasi Bergerak) */
    .reward-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      flex-direction: column;
      animation: fadeIn 0.3s ease;
    }

    .reward-box {
      background: linear-gradient(135deg, #1E1B4B 0%, #312E81 100%);
      border: 4px solid #F59E0B;
      border-radius: 28px;
      padding: 20px 22px 24px;
      text-align: center;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.6);
      max-width: 92%;
      width: 420px;
      position: relative;
    }

    .character-avatar {
      width: min(320px, 80vw);
      height: auto;
      margin: 0 auto 8px auto;
      position: relative;
      animation: charJump 1s infinite alternate ease-in-out;
    }

    .character-avatar img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.55));
      pointer-events: none;
    }

    @keyframes charJump {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-12px) rotate(1deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="../index.html" class="nav-btn">🏠 Ke Menu Utama</a>
    <span style="font-weight: bold; color: #FBBF24;">Pernapasan Matematika: Jurus 1! ⚡</span>
  </div>

  <header>
    <h1>⚔️ Misi Kotak Rahasia Korps Pembasmi Iblis</h1>
  </header>

  <div class="level-tabs">
    <button class="level-btn active" onclick="selectLevel(0)">Level 1: Tambah & Kurang</button>
    <button class="level-btn" onclick="selectLevel(1)">Level 2: Perkalian</button>
    <button class="level-btn" onclick="selectLevel(2)">Level 3: Pembagian</button>
    <button class="level-btn" onclick="selectLevel(3)">Level 4: Campuran ( )</button>
  </div>

  <div class="game-board">
    <div class="control-actions">
      <button class="action-btn random-btn" onclick="generateRandomProblem()">🎲 Ganti Soal Baru</button>
      <button class="action-btn reset-btn" onclick="resetCurrentProblem()">🔄 Ulangi Posisi</button>
    </div>

    <div class="mix-hint" id="mix-hint"></div>

    <div class="equation-container">
      <div class="side-zone" id="left-zone" data-side="left"></div>
      <div class="equals-bridge">=</div>
      <div class="side-zone" id="right-zone" data-side="right"></div>
    </div>

    <div class="solution-box">
      <div class="calc-preview" id="calc-preview">Geser operasi matematika ke sisi kanan tanda sama dengan!</div>
      
      <div class="guess-row">
        <span>🎁 = </span>
        <input type="number" id="answer-input" placeholder="?">
        <button class="check-btn" onclick="handleOpenBox()">Buka Kotak! ⚔️</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <!-- POPUP REWARD ANIMASI DEMON SLAYER -->
  <div class="reward-overlay" id="reward-modal">
    <div class="reward-box">
      <div class="character-avatar">
        <img id="reward-character" src="images/tanjiro-reward.png" alt="Tanjiro Kamado">
      </div>

      <h2 id="reward-title" style="margin: 6px 0; color: #FBBF24;">LUAR BIASA! 💥</h2>
      <p style="color: #E2E8F0; font-size: 15px; margin-bottom: 18px;" id="reward-desc">
        Kamu berhasil memecahkan teka-teki kotak dan mengeluarkan jurus pernapasan!
      </p>

      <button class="check-btn" style="width: 100%; background: #EF4444;" onclick="closeRewardModal()">
        Lanjut Misi Berikutnya! ⚔️
      </button>
    </div>
  </div>

  <script>
    let currentLevelIdx = 0;
    let initialProblemData = null; // Menyimpan format awal untuk fitur reset
    let currentData = null;

    const inverseOps = {
      '+': '-',
      '-': '+',
      '×': '÷',
      '÷': '×'
    };

    const rewardCharacters = [
      {
        src: 'images/tanjiro-reward.png',
        name: 'Tanjiro',
        title: 'Hinokami Kagura! 🔥',
        praise: 'Tanjiro bangga dengan kemampuan analisismu!'
      },
      {
        src: 'images/shinobu-reward.png',
        name: 'Shinobu',
        title: 'Jurus Kupu-Kupu! 🦋',
        praise: 'Shinobu tersenyum: ketelitianmu sangat indah.'
      },
      {
        src: 'images/zenitsu-reward.png',
        name: 'Zenitsu',
        title: 'Pernapasan Petir! ⚡',
        praise: 'Zenitsu kaget... kamu hebat sekali!'
      },
      {
        src: 'images/rengoku-reward.png',
        name: 'Rengoku',
        title: 'UMAI! Setinggi api! 🔥',
        praise: 'Rengoku berteriak: semangatmu membara!'
      },
      {
        src: 'images/inosuke-reward.png',
        name: 'Inosuke',
        title: 'Raja Gunung! 🐗',
        praise: 'Inosuke mengaku: otakmu lebih kuat dari ototnya!'
      },
      {
        src: 'images/inosuke-chibi-reward.png',
        name: 'Inosuke',
        title: 'Serangan Ganda! ⚔️',
        praise: 'Inosuke tanpa topeng pun kagum pada hitunganmu!'
      }
    ];

    function pickRewardCharacter() {
      return rewardCharacters[Math.floor(Math.random() * rewardCharacters.length)];
    }

    function showRewardModal(answer) {
      const hero = pickRewardCharacter();
      const img = document.getElementById('reward-character');
      img.src = hero.src;
      img.alt = hero.name;
      document.getElementById('reward-title').innerText = hero.title;
      document.getElementById('reward-desc').innerHTML =
        `Hebat sekali! Isi kotak 🎁 adalah <b>${answer}</b>.<br>${hero.praise}`;
      document.getElementById('reward-modal').style.display = 'flex';
    }

    // Generator Soal Acak
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function getBoxSide(data) {
      const source = data || currentData;
      if (!source) return 'left';
      if (source.left && source.left.some((i) => i.type === 'box')) return 'left';
      if (source.right && source.right.some((i) => i.type === 'box')) return 'right';
      return source.boxHome || 'left';
    }

    function otherSide(side) {
      return side === 'left' ? 'right' : 'left';
    }

    function awayDirectionLabel(boxSide) {
      return boxSide === 'left' ? 'kanan' : 'kiri';
    }

    function maybePlaceBoxRandomly(data) {
      const boxOnRight = Math.random() < 0.5;
      data.boxHome = boxOnRight ? 'right' : 'left';

      if (boxOnRight) {
        const newLeft = data.right.map((item) => Object.assign({}, item, { currentSide: 'left' }));
        const newRight = data.left.map((item) => Object.assign({}, item, { currentSide: 'right' }));
        data.left = newLeft;
        data.right = newRight;

        if (data.explain && data.explain.includes(' = ')) {
          const parts = data.explain.split(' = ');
          data.explain = `${parts[1]} = ${parts[0]}`;
        }
        if (data.orderHint) {
          data.orderHint = data.orderHint.replace(/ke kanan/g, 'ke kiri');
        }
      } else {
        data.left.forEach((item) => { item.currentSide = 'left'; });
        data.right.forEach((item) => { item.currentSide = 'right'; });
      }

      return data;
    }

    function createRandomLevelData(levelIdx) {
      let data;

      if (levelIdx === 0) {
        // Tambah & Kurang
        const isPlus = Math.random() > 0.5;
        const op = isPlus ? '+' : '-';
        const num = getRandomInt(2, 9);
        const x = getRandomInt(3, 10);
        const target = isPlus ? (x + num) : (x + 10 - num);
        const actualX = isPlus ? (target - num) : (target + num);

        data = {
          left: [
            { id: 'box', type: 'box', label: '🎁' },
            { id: 'op1', type: 'op', op: op, val: num, currentSide: 'left' }
          ],
          right: [{ id: 'res', type: 'number', val: target }],
          targetAnswer: actualX
        };
      } else if (levelIdx === 1) {
        // Perkalian (x * a = b)
        const a = getRandomInt(2, 5);
        const actualX = getRandomInt(2, 9);
        const target = actualX * a;

        data = {
          left: [
            { id: 'box', type: 'box', label: '🎁' },
            { id: 'op1', type: 'op', op: '×', val: a, currentSide: 'left' }
          ],
          right: [{ id: 'res', type: 'number', val: target }],
          targetAnswer: actualX
        };
      } else if (levelIdx === 2) {
        // Pembagian (x / a = b)
        const a = getRandomInt(2, 5);
        const b = getRandomInt(2, 8);
        const actualX = a * b;

        data = {
          left: [
            { id: 'box', type: 'box', label: '🎁' },
            { id: 'op1', type: 'op', op: '÷', val: a, currentSide: 'left' }
          ],
          right: [{ id: 'res', type: 'number', val: b }],
          targetAnswer: actualX
        };
      } else {
        data = createMixedLevelData();
      }

      return maybePlaceBoxRandomly(data);
    }

    // Level 4: campuran perkalian & penjumlahan/pengurangan + kurung
    function createMixedLevelData() {
      const patternIdx = getRandomInt(0, 2);
      const a = getRandomInt(2, 4);
      const actualX = getRandomInt(2, 6);
      const b = getRandomInt(1, 6);

      if (patternIdx === 0) {
        // (x × a) + b = target  → geser +b dulu, baru ×a
        const target = (actualX * a) + b;
        return {
          mixedPattern: 'mul-then-add',
          innerOpIds: ['op1'],
          explain: `(🎁 × ${a}) + ${b} = ${target}`,
          orderHint: `Hitung yang di dalam kurung dulu: perkalian. Geser dulu + ${b} (luar kurung), baru × ${a}.`,
          left: [
            { id: 'box', type: 'box', label: '🎁' },
            { id: 'op1', type: 'op', op: '×', val: a, currentSide: 'left' },
            { id: 'op2', type: 'op', op: '+', val: b, currentSide: 'left' }
          ],
          right: [{ id: 'res', type: 'number', val: target }],
          targetAnswer: actualX
        };
      }

      if (patternIdx === 1) {
        // (x × a) − b = target  → geser −b dulu, baru ×a
        const product = actualX * a;
        const sub = Math.min(b, product - 1);
        const target = product - sub;
        return {
          mixedPattern: 'mul-then-sub',
          innerOpIds: ['op1'],
          explain: `(🎁 × ${a}) − ${sub} = ${target}`,
          orderHint: `Hitung yang di dalam kurung dulu: perkalian. Geser dulu − ${sub} (luar kurung), baru × ${a}.`,
          left: [
            { id: 'box', type: 'box', label: '🎁' },
            { id: 'op1', type: 'op', op: '×', val: a, currentSide: 'left' },
            { id: 'op2', type: 'op', op: '-', val: sub, currentSide: 'left' }
          ],
          right: [{ id: 'res', type: 'number', val: target }],
          targetAnswer: actualX
        };
      }

      // (x + b) × a = target  → geser ×a dulu (luar kurung), baru +b
      const target = (actualX + b) * a;
      return {
        mixedPattern: 'add-then-mul',
        innerOpIds: ['op1'],
        explain: `(🎁 + ${b}) × ${a} = ${target}`,
        orderHint: `Hitung yang di dalam kurung dulu: penjumlahan. Geser dulu × ${a} (luar kurung), baru + ${b}.`,
        left: [
          { id: 'box', type: 'box', label: '🎁' },
          { id: 'op1', type: 'op', op: '+', val: b, currentSide: 'left' },
          { id: 'op2', type: 'op', op: '×', val: a, currentSide: 'left' }
        ],
        right: [{ id: 'res', type: 'number', val: target }],
        targetAnswer: actualX
      };
    }

    function applyOp(leftVal, op, rightVal) {
      if (op === '+') return leftVal + rightVal;
      if (op === '-') return leftVal - rightVal;
      if (op === '×') return leftVal * rightVal;
      if (op === '÷') return leftVal / rightVal;
      return leftVal;
    }

    function formatToken(item) {
      if (item.type === 'number') return `${item.val}`;
      if (item.type === 'box') return item.label;
      return `${item.op} ${item.val}`;
    }

    function makeParen(label) {
      const el = document.createElement('span');
      el.className = 'paren-mark';
      el.textContent = label;
      el.setAttribute('aria-hidden', 'true');
      return el;
    }

    function appendParenGroup(parent, items) {
      const wrap = document.createElement('div');
      wrap.className = 'paren-group';
      wrap.appendChild(makeParen('('));
      items.forEach((it) => wrap.appendChild(createCard(it)));
      wrap.appendChild(makeParen(')'));
      parent.appendChild(wrap);
    }

    function selectLevel(idx) {
      currentLevelIdx = idx;
      document.querySelectorAll('.level-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });
      generateRandomProblem();
    }

    function updateMixHint() {
      const hintEl = document.getElementById('mix-hint');
      if (currentLevelIdx === 3 && currentData && currentData.explain) {
        hintEl.style.display = 'block';
        hintEl.innerHTML = `Kurung <b>( )</b> artinya hitung yang di dalam dulu!<br>Soal: <b>${currentData.explain}</b><br>${currentData.orderHint}`;
      } else {
        hintEl.style.display = 'none';
        hintEl.innerHTML = '';
      }
    }

    function generateRandomProblem() {
      initialProblemData = createRandomLevelData(currentLevelIdx);
      resetCurrentProblem();
    }

    function resetCurrentProblem() {
      // Mengkloning data dari problem asli
      currentData = JSON.parse(JSON.stringify(initialProblemData));
      document.getElementById('feedback').innerText = '';
      document.getElementById('answer-input').value = '';
      renderBoard();
    }

    function renderBoard() {
      currentData.left.forEach((item) => { item.currentSide = 'left'; });
      currentData.right.forEach((item) => { item.currentSide = 'right'; });
      renderZone(document.getElementById('left-zone'), currentData.left, 'left');
      renderZone(document.getElementById('right-zone'), currentData.right, 'right');
      setupDropZones();
      updateMixHint();
      updateStatusGuide();
    }

    function splitInnerOuter(items) {
      const innerIds = currentData.innerOpIds || [];
      return {
        box: items.find((i) => i.type === 'box'),
        numbers: items.filter((i) => i.type === 'number'),
        innerOps: items.filter((i) => i.type === 'op' && innerIds.includes(i.id)),
        outerOps: items.filter((i) => i.type === 'op' && !innerIds.includes(i.id))
      };
    }

    function renderZone(zoneEl, items, side) {
      zoneEl.innerHTML = '';

      if (!currentData.mixedPattern) {
        items.forEach((item) => zoneEl.appendChild(createCard(item)));
        return;
      }

      const { box, numbers, innerOps, outerOps } = splitInnerOuter(items);

      if (box && innerOps.length > 0) {
        appendParenGroup(zoneEl, [box, ...innerOps]);
        outerOps.forEach((op) => zoneEl.appendChild(createCard(op)));
        return;
      }

      if (!box && outerOps.length > 0 && innerOps.length > 0) {
        appendParenGroup(zoneEl, [...numbers, ...outerOps]);
        innerOps.forEach((op) => zoneEl.appendChild(createCard(op)));
        return;
      }

      items.forEach((item) => zoneEl.appendChild(createCard(item)));
    }

    function createCard(item) {
      const card = document.createElement('div');
      card.id = item.id;
      card.classList.add('card');
      const canDragFromRight = (item.type === 'box' || item.type === 'number') && item.currentSide === 'right';

      if (item.type === 'box') {
        card.classList.add('box');
        card.innerText = item.label;
        if (canDragFromRight) {
          card.classList.add('can-drag-left');
          card.draggable = true;
          setupDragAndTouch(card, item);
        }
      } else if (item.type === 'op') {
        card.classList.add('draggable-op');
        card.innerText = `${item.op} ${item.val}`;
        card.draggable = true;
        setupDragAndTouch(card, item);
      } else if (item.type === 'number') {
        card.classList.add('number-static');
        card.innerText = item.val;
        if (canDragFromRight) {
          card.classList.add('can-drag-left');
          card.draggable = true;
          setupDragAndTouch(card, item);
        }
      }

      return card;
    }

    // Drag & Drop Handling (Mouse & iPad Touch)
    let activeDragItem = null;

    function setupDragAndTouch(card, itemData) {
      card.addEventListener('dragstart', (e) => {
        activeDragItem = itemData;
        e.dataTransfer.setData('text/plain', itemData.id);
      });

      card.addEventListener('touchstart', (e) => {
        activeDragItem = itemData;
      }, { passive: true });

      card.addEventListener('touchend', (e) => {
        const touch = e.changedTouches[0];
        const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
        const zone = targetElement ? targetElement.closest('.side-zone') : null;

        if (zone && zone.dataset.side !== activeDragItem.currentSide) {
          executeMove(activeDragItem, zone.dataset.side);
        }
        activeDragItem = null;
      });
    }

    function setupDropZones() {
      document.querySelectorAll('.side-zone').forEach(zone => {
        zone.ondragover = (e) => { e.preventDefault(); zone.classList.add('drag-over'); };
        zone.ondragleave = () => { zone.classList.remove('drag-over'); };
        zone.ondrop = (e) => {
          e.preventDefault();
          zone.classList.remove('drag-over');
          if (activeDragItem && activeDragItem.currentSide !== zone.dataset.side) {
            executeMove(activeDragItem, zone.dataset.side);
          }
        };
      });
    }

    function showMoveWarning(message) {
      const feedback = document.getElementById('feedback');
      feedback.className = 'feedback warning';
      feedback.innerText = message;
    }

    function executeMove(item, newSide) {
      const oldSide = item.currentSide;
      const goingRight = oldSide === 'left' && newSide === 'right';
      const goingLeft = oldSide === 'right' && newSide === 'left';

      // Kotak & angka: tidak boleh kiri → kanan, boleh kanan → kiri
      if ((item.type === 'box' || item.type === 'number') && goingRight) {
        showMoveWarning('⚠️ Kotak 🎁 dan angka tidak bisa digeser ke kanan. Geser dari kanan ke kiri saja.');
        return;
      }

      const innerIds = currentData.innerOpIds || [];
      const boxSide = getBoxSide();
      const leavingBoxSide = oldSide === boxSide && newSide !== boxSide;
      if (currentData.mixedPattern && innerIds.includes(item.id) && leavingBoxSide) {
        const outerStillHere = currentData[item.currentSide].filter(
          (i) => i.type === 'op' && !innerIds.includes(i.id)
        );
        if (outerStillHere.length > 0) {
          const firstOuter = outerStillHere[0];
          showMoveWarning(`⚠️ Geser dulu yang di LUAR kurung (${firstOuter.op} ${firstOuter.val}), baru yang di dalam!`);
          return;
        }
      }

      currentData[oldSide] = currentData[oldSide].filter(i => i.id !== item.id);

      if (item.type === 'number' && goingLeft) {
        item.type = 'op';
        item.op = '-';
        item.fromNumber = true;
      } else if (item.fromNumber && goingRight) {
        item.type = 'number';
        delete item.op;
      } else if (item.type === 'op') {
        item.op = inverseOps[item.op];
      }

      item.currentSide = newSide;
      currentData[newSide].push(item);

      if (currentData.right.length === 0) {
        currentData.right.push({ id: 'res-zero', type: 'number', val: 0, currentSide: 'right' });
      }
      const rightNumbers = currentData.right.filter((i) => i.type === 'number');
      if (rightNumbers.length > 1) {
        currentData.right = currentData.right.filter((i) => i.id !== 'res-zero');
      }

      document.getElementById('feedback').innerText = '';
      renderBoard();
    }

    function buildMixedFormula(items) {
      const { numbers, innerOps, outerOps } = splitInnerOuter(items);
      if (outerOps.length > 0 && innerOps.length > 0) {
        const inside = [...numbers, ...outerOps].map(formatToken).join(' ');
        const outside = innerOps.map(formatToken).join(' ');
        return `(${inside}) ${outside}`;
      }
      return items.filter((i) => i.type !== 'box').map(formatToken).join(' ');
    }

    function buildMixedSteps(items) {
      const { numbers, innerOps, outerOps } = splitInnerOuter(items);
      if (!numbers.length || !outerOps.length || !innerOps.length) return '';

      let mid = numbers[0].val;
      const step1expr = [numbers[0], ...outerOps].map(formatToken).join(' ');
      outerOps.forEach((op) => { mid = applyOp(mid, op.op, op.val); });

      let result = mid;
      const step2expr = [`${mid}`, ...innerOps.map(formatToken)].join(' ');
      innerOps.forEach((op) => { result = applyOp(result, op.op, op.val); });

      return `Langkah 1 (dalam kurung): ${step1expr} = ${mid}. Lalu langkah 2: ${step2expr} = ${result}.`;
    }

    function updateStatusGuide() {
      const boxSide = getBoxSide();
      const solveSide = otherSide(boxSide);
      const remainingBoxOps = currentData[boxSide].filter((i) => i.type === 'op');
      const preview = document.getElementById('calc-preview');
      const away = awayDirectionLabel(boxSide);

      if (remainingBoxOps.length === 0) {
        const formulaItems = currentData[solveSide];
        const formula = currentData.mixedPattern
          ? buildMixedFormula(formulaItems)
          : formulaItems.map(formatToken).join(' ');
        const steps = currentData.mixedPattern ? buildMixedSteps(formulaItems) : '';
        preview.innerHTML = `Kotak sudah sendirian! Selesaikan: <b style="color:#38BDF8; font-size:20px;">${formula}</b>`
          + (steps ? `<br><span style="color:#FDE68A; font-size:14px;">${steps}</span>` : '');
      } else if (currentData.mixedPattern) {
        const outerOnBox = currentData[boxSide].filter(
          (i) => i.type === 'op' && !(currentData.innerOpIds || []).includes(i.id)
        );
        if (outerOnBox.length > 0) {
          preview.innerText = `Geser dulu kartu di LUAR kurung (${outerOnBox[0].op} ${outerOnBox[0].val}) ke ${away}.`;
        } else {
          preview.innerText = `Bagus! Sekarang geser kartu di dalam kurung ke ${away} agar 🎁 sendirian.`;
        }
      } else {
        preview.innerText = `Geser ${remainingBoxOps.length} kartu lagi ke ${away} agar kotak 🎁 sendirian!`;
      }
    }

    // Tantangan Validasi & Reward Karakter
    function handleOpenBox() {
      const boxSide = getBoxSide();
      const remainingBoxOps = currentData[boxSide].filter((i) => i.type === 'op');
      const inputVal = parseInt(document.getElementById('answer-input').value);
      const feedback = document.getElementById('feedback');
      const away = awayDirectionLabel(boxSide);

      // TANTANGAN 1: Wajib geser kartu dulu
      if (remainingBoxOps.length > 0) {
        feedback.className = 'feedback warning';
        feedback.innerText = `⚠️ Tidak bisa ditebak langsung! Geser kartu operasinya dulu ke ${away} tanda sama dengan!`;
        return;
      }

      // TANTANGAN 2: Input tidak boleh kosong
      if (isNaN(inputVal)) {
        feedback.className = 'feedback warning';
        feedback.innerText = `Ketik dulu angka tebakanmu di dalam kolom!`;
        return;
      }

      // TANTANGAN 3: Pencocokan Jawaban
      if (inputVal === currentData.targetAnswer) {
        feedback.className = 'feedback success';
        feedback.innerText = `BENAR! Kotak Terbuka! 🌟`;

        showRewardModal(inputVal);
      } else {
        feedback.className = 'feedback error';
        const solveLabel = boxSide === 'left' ? 'kanannya' : 'kirinya';
        feedback.innerText = `Kurang tepat, ayo coba hitung ulang kembali sisi ${solveLabel}! Semangat! 💪`;
      }
    }

    function closeRewardModal() {
      document.getElementById('reward-modal').style.display = 'none';
      generateRandomProblem(); // Berikan soal baru setelah berhasil
    }

    // Mulai Level 1 Pertama Kali
    selectLevel(0);
  </script>
</body>
